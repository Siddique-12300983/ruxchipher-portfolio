<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · ruxchipher</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<style>
  :root { --bg:#05070f; --text:#e6ebf5; --muted:#9aa3bc; --cyan:#00c8ff; --purple:#8f75ff; --red:#ff5c7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .box { width:min(520px,100%); border:1px solid rgba(120,140,200,.28); border-radius:14px; background:#0d1224; padding:24px; font-size:14px; line-height:1.9; }
  .p { color:var(--purple); } .r { color:var(--red); } .m { color:var(--muted); }
  a { display:inline-block; margin-top:18px; color:var(--bg); background:linear-gradient(120deg,var(--cyan),var(--purple)); padding:10px 18px; border-radius:10px; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <main class="box">
    <div><span class="p">❯</span> cd <span id="path">this-page</span></div>
    <div class="r">cd: no such file or directory (404)</div>
    <div class="m"># the page you wanted isn't in the lab.</div>
    <a href="/">return home</a>
  </main>
</body>
</html>
